<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Rounded App Background -->
  <rect width="64" height="64" rx="14" fill="#0f1117" />
  <rect width="62" height="62" x="1" y="1" rx="13" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1.5" />

  <defs>
    <linearGradient id="root-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="left-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2dd4bf" />
      <stop offset="100%" stop-color="#0d9488" />
    </linearGradient>
    <linearGradient id="right-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#7c3aed" />
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="1" stdDeviation="2.5" flood-color="#06b6d4" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Connecting Edges -->
  <!-- Root to Mid -->
  <path d="M32 15 L18 33" stroke="#0891b2" stroke-width="2.5" stroke-linecap="round" />
  <path d="M32 15 L46 33" stroke="#8b5cf6" stroke-width="2.5" stroke-linecap="round" />

  <!-- Mid to Leaves -->
  <path d="M18 33 L12 49" stroke="#14b8a6" stroke-width="2" stroke-linecap="round" opacity="0.85" />
  <path d="M18 33 L24 49" stroke="#06b6d4" stroke-width="2" stroke-linecap="round" opacity="0.85" />
  <path d="M46 33 L40 49" stroke="#a855f7" stroke-width="2" stroke-linecap="round" opacity="0.85" />
  <path d="M46 33 L52 49" stroke="#ec4899" stroke-width="2" stroke-linecap="round" opacity="0.85" />

  <!-- Level 2 Leaf Nodes -->
  <circle cx="12" cy="49" r="3.5" fill="#14b8a6" stroke="#99f6e4" stroke-width="1.5" />
  <circle cx="24" cy="49" r="3.5" fill="#06b6d4" stroke="#bae6fd" stroke-width="1.5" />
  <circle cx="40" cy="49" r="3.5" fill="#a855f7" stroke="#e9d5ff" stroke-width="1.5" />
  <circle cx="52" cy="49" r="3.5" fill="#ec4899" stroke="#fbcfe8" stroke-width="1.5" />

  <!-- Level 1 Intermediate Nodes -->
  <circle cx="18" cy="33" r="5.5" fill="url(#left-grad)" stroke="#ccfbf1" stroke-width="1.8" filter="url(#glow)" />
  <circle cx="46" cy="33" r="5.5" fill="url(#right-grad)" stroke="#f3e8ff" stroke-width="1.8" filter="url(#glow)" />

  <!-- Root Node with Glow & Accent Core -->
  <circle cx="32" cy="15" r="7.5" fill="url(#root-grad)" stroke="#e0f2fe" stroke-width="2" filter="url(#glow)" />
  <circle cx="32" cy="15" r="2.8" fill="#ffffff" />
</svg>